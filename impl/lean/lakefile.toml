name = "slimebench"
defaultTargets = ["slimebench", "Proofs"]

[[lean_lib]]
name = "Slimebench"

# The machine-checked parts of SPEC-1. A library rather than an executable:
# nothing runs, the point is that it elaborates. It is in defaultTargets so a
# plain `lake build` fails if a proof breaks -- a proof that is not checked by
# the build is a comment.
[[lean_lib]]
name = "Proofs"

[[lean_exe]]
name = "slimebench"
root = "Main"

# The class P experiment. A separate executable rather than a flag on the main
# one: it answers a question about the language, not about the simulation, and
# it is not part of the benchmark matrix.
[[lean_exe]]
name = "lean-tasks"
root = "Bench.Tasks"

# slimebench target registry.
#
# One [[target]] per implementation/backend. The (compiler x profile) cross
# product is the compiler-comparison axis; every combination gets its own
# binary and its own result row.
#
# Placeholders available in `build`, `binary` and `run`:
#   {cc}       current compiler id
#   {profile}  current profile id
#   {binary}   resolved `binary` path (absolute)
#   {dir}      target directory (absolute)
#
# Optional fields:
#   updates            SPEC-1 5.5 modes the target implements (default both)
#   conformance_set    "full" (micro+tiny+small) or "micro" (slow targets)
#   tier               "A" bit-exact, "B" tolerance-based (SPEC-1 7)
#   fastmath_profiles  profiles that deliberately break tier A -> class C
#   headless_capable   false = built for footprint only, never timed
#   extra_args         appended to every invocation

# --------------------------------------------------------------------------- C

[[target]]
id       = "c"
lang     = "C"
backend  = "headless"
class    = "S"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc", "clang"]
profiles  = ["o0", "o2", "o3", "o3-native", "o3-native-lto", "ofast-native"]
fastmath_profiles = ["ofast", "ofast-native"]

[[target]]
id       = "c-sdl2"
lang     = "C"
backend  = "sdl2"
class    = "R"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} sdl2"
binary   = "build/{cc}-{profile}/slimebench-sdl2"
run      = ["{binary}"]
compilers = ["gcc"]
profiles  = ["o3-native"]
headless_capable = false

# The class V and P entries below are the same binaries as `c`, differing only
# in a runtime flag, so conformance skips them. Their equivalence to the scalar
# and single-threaded paths is verified separately and documented in
# docs/RESULTS.md.

[[target]]
# The agent pass, vectorised *and* spatially ordered. Two changes rather than
# one, because they answer the same question from opposite ends: the kernel is
# memory-bound, so the vector version reduces instructions and the ordering
# reduces the distance between the addresses those instructions touch.
#
# Conformance is checked here for the same reason as c-simd-agents, and for
# one more: this target permutes the agent arrays. That is only sound because
# SPEC-1 fixes the order deposits are *applied* in, not the order agents are
# *stepped* in -- and the argument is worth nothing without the gate agreeing.
id       = "c-simd-agents-tiled"
lang     = "C"
backend  = "simd"
class    = "V"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc", "clang"]
profiles  = ["o3-native"]
extra_args = ["--simd-agents", "--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
# Four more, and the question they answer is whether the factor survives a
# runtime that compiles while it runs and one whose idiom is not a mutable
# array. It does: the JIT languages gain more than C does, not less.
id       = "java-tiled"
lang     = "Java"
backend  = "scalar"
class    = "V"
dir      = "impl/java"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["javac"]
profiles  = ["default"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
id       = "csharp-tiled"
lang     = "C#"
backend  = "scalar"
class    = "V"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
profiles  = ["jit"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
id       = "swift-tiled"
lang     = "Swift"
backend  = "scalar"
class    = "V"
dir      = "impl/swift"

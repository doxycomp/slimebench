# ---------------------------------------------------------------------- Python

[[target]]
id       = "python-numpy"
lang     = "Python"
backend  = "numpy"
class    = "S"
dir      = "impl/python"
run      = ["python3", "{dir}/slimebench_numpy.py"]
compilers = ["python3"]
profiles  = ["default"]
# SPEC-1 5.5 'serial' has a sequential dependency through the grid that cannot
# be vectorised. Documented in the module docstring; this is a finding.
updates  = ["deferred"]

# The free-threaded interpreter is a separate target rather than a profile of
# the one above: it is a different binary with a different numpy, so pretending
# it is the same target would hide the confound.
[[target]]
id       = "python-numpy-ft"
lang     = "Python"
backend  = "numpy-3.14t"
class    = "S"
dir      = "impl/python"
run      = ["{python314t}", "{dir}/slimebench_numpy.py"]
compilers = ["python3.14t"]
profiles  = ["default"]
updates  = ["deferred"]
optional = true

# The same program as python-pure -- same loops, same order, same names -- with
# @njit on the kernels. That is the point: the ratio between the two is the
# interpreter and nothing else. It is tier A without a strictness flag, because
# numba has f32 as a real type where CPython does not.
#
# The `fastmath` profile compiles the identical source with LLVM's fast-math
# flags and is conformance tier C. Conformance always picks a non-fastmath
# profile, so it is benchmarked but never asked to be bit-exact -- the same
# treatment the C targets' ofast builds get.
[[target]]
id       = "python-numba"
lang     = "Python"
backend  = "numba"
class    = "S"
dir      = "impl/python"
run      = ["{numbapy}", "{dir}/slimebench_numba.py"]
compilers = ["numba"]
profiles  = ["default", "fastmath"]
fastmath_profiles = ["fastmath"]
profile_args = { fastmath = ["--fastmath"] }
optional = true

[[target]]
id       = "python-pure"
lang     = "Python"
backend  = "pure"
class    = "S"
dir      = "impl/python"
run      = ["python3", "{dir}/slimebench_pure.py"]
compilers = ["python3"]
profiles  = ["default"]
conformance_set = "micro"
tier     = "B"

[[target]]
id       = "python-pure-strict"
lang     = "Python"
backend  = "pure-strict"
class    = "S"
dir      = "impl/python"
run      = ["python3", "{dir}/slimebench_pure.py"]
compilers = ["python3"]
profiles  = ["default"]
conformance_set = "micro"
extra_args = ["--strict-f32"]


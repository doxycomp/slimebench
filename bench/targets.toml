binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["swift"]
profiles  = ["unchecked"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
id       = "haskell-tiled"
lang     = "Haskell"
backend  = "scalar"
class    = "V"
dir      = "impl/haskell"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["ghc"]
profiles  = ["o2-llvm"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
# The same spatial ordering in C++ and in Rust. Three languages doing the same
# thing to the same bottleneck: the interesting number is not any one of them
# but whether the factor survives a different memory model and a different
# standard library. C memcpys through staging buffers, C++ swaps std::vectors,
# Rust swaps Vecs -- and all three have to keep the agent hash walking agents
# in agent order through the inverse permutation, which is where a port of
# this would most easily go wrong without the gate noticing.
id       = "cpp-tiled"
lang     = "C++"
backend  = "scalar"
class    = "V"
dir      = "impl/cpp"
build    = "make CXX={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["g++"]
profiles  = ["o3-native"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
# Go as well, because it is the one collected language here whose agent arrays
# are slices the runtime owns. The permutation allocates nothing -- the
# staging buffers are made once -- but it moves 26 bytes per agent per
# re-sort, and whether a garbage-collected runtime minds that is not something
# the C row can answer.
id       = "go-tiled"
lang     = "Go"
backend  = "scalar"
class    = "V"
dir      = "impl/go"
# `bash build.sh`, not `./build.sh`: impl/go/build.sh is mode 644 in git, and
# a container copies that faithfully where WSL on a Windows filesystem reports
# everything as executable. The `go` target has said `bash` for the same
# reason since it was written.
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["go"]
profiles  = ["nobounds"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
id       = "rust-tiled"
lang     = "Rust"
backend  = "scalar"
class    = "V"
dir      = "impl/rust"
build    = "cargo build --release"
binary   = "target/release/slimebench"
run      = ["{binary}"]
compilers = ["cargo"]
profiles  = ["release"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
# Spatial ordering alone, with the scalar kernel. The pair with the row above
# separates what the ordering is worth from what the vector unit is worth;
# without it a single number would be credited to whichever of the two the
# reader already believed in.
id       = "c-tiled"
lang     = "C"
backend  = "scalar"
class    = "V"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc"]
profiles  = ["o3-native"]
extra_args = ["--agent-tile", "2"]
updates  = ["deferred"]

[[target]]
# The agent pass, vectorised. A separate target from c-simd because it is a
# separate kernel answering a separate question: c-simd is the diffusion
# stencil, which is 11 to 22 % of a tick, and this is the other 78 to 89 %.
#
# Conformance is NOT skipped here, unlike c-simd. The stencil's bit-exactness
# follows from SPEC-1 8.1 -- no cross-lane work, so each lane is the scalar
# computation -- and is verified once. This kernel has a data-dependent
# four-way branch, a masked direction update and a PRNG that only some lanes
# may advance, and none of that is an argument, so it is checked.
id       = "c-simd-agents"
lang     = "C"
backend  = "simd"
class    = "V"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc", "clang"]
profiles  = ["o3-native"]
extra_args = ["--simd-agents"]
updates  = ["deferred"]

[[target]]
id       = "c-simd"
lang     = "C"
backend  = "simd"
class    = "V"
dir      = "impl/c"
build    = "make CC={cc} PROFILE={profile} headless"
binary   = "build/{cc}-{profile}/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc", "clang"]
# o3-v3 is AVX2 (8 lanes), o3-native is AVX-512 on this part (16 lanes).
profiles  = ["o3-v3", "o3-native"]
extra_args = ["--simd"]
# Bit-identical to the scalar path (SPEC-1 8.1), verified separately; running
# the whole vector set again would only re-check the same thing.
skip_conformance = true

[[target]]
id       = "c-pgo"
lang     = "C"
backend  = "pgo"
class    = "S"
dir      = "impl/c"
build    = "bash pgo.sh {cc}"
binary   = "build/{cc}-o3-native-pgo/slimebench-headless"
run      = ["{binary}"]
compilers = ["gcc", "clang"]
profiles  = ["o3-native-pgo"]
skip_conformance = true


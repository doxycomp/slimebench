[[target]]
# fork + pipes, not ithreads: threads::shared costs 7.6x per random access on
# this machine, which the deposit and diffusion passes could never earn back.
# The reduction is replicated rather than partitioned, which makes it exactly
# the serial chain for any process count. See impl/perl/slimebench.pl.
id       = "perl-par"
lang     = "Perl"
backend  = "fork/replicated"
class    = "P"
dir      = "impl/perl"
build    = ""
binary   = "slimebench.pl"
run      = ["perl", "{binary}"]
compilers = ["perl"]
profiles  = ["default"]
updates  = ["deferred"]
tier     = "B"
conformance_set = "micro"
skip_conformance = true


# ------------------------------------------------------------------------- C#
#
# The only target that compiles the same source both through a JIT and ahead of
# time to a native binary. That is why it is here: every other language in this
# project sits on one side of that line and stays there, so "what does runtime
# profile information buy over ahead-of-time compilation?" had no answer.
#
# Four profiles, one source, and all four must produce the same hashes:
#   jit    tiered JIT with dynamic PGO -- what `dotnet run` does
#   tier1  TieredCompilation off, straight to the optimising JIT
#   r2r    ReadyToRun: IL compiled ahead of time, runtime still present
#   aot    Native AOT: a static binary, no JIT, no runtime

[[target]]
id       = "csharp"
lang     = "C#"
backend  = "headless"
class    = "S"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
profiles  = ["jit", "tier1", "r2r", "aot", "aot-native"]

# Class V. Two rows because .NET has two answers and they are not the same
# machine code: the portable Vector<T> caps at 256 bits on this hardware even
# though Vector512.IsHardwareAccelerated is true, so naming the width
# explicitly is the only way to reach AVX-512. Same relationship as c-simd's
# o3-v3 and o3-native profiles.
[[target]]
id       = "csharp-simd"
lang     = "C#"
backend  = "simd"
class    = "V"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
# aot is the *default* Native AOT build and gets only 128-bit vectors: the
# compiler targets the x64 baseline unless told otherwise. aot-native is the
# same source with -p:IlcInstructionSet=native. Both are here because the gap
# between them is the result.
profiles  = ["aot", "aot-native", "tier1"]
extra_args = ["--simd"]
# Bit-identical to the scalar path (SPEC-1 8.1), verified separately.
skip_conformance = true

[[target]]
id       = "csharp-simd-portable"
lang     = "C#"
backend  = "simd/portable"
class    = "V"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
profiles  = ["aot"]
extra_args = ["--simd-portable"]
skip_conformance = true

[[target]]
id       = "java-simd"
lang     = "Java"
backend  = "simd"
class    = "V"
dir      = "impl/java"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["javac"]
profiles  = ["c2", "default"]
extra_args = ["--simd"]
# Bit-identical to the scalar path (SPEC-1 8.1), verified separately.
skip_conformance = true

[[target]]
id       = "csharp-par-binned"
lang     = "C#"
backend  = "threads/binned"
class    = "P"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
# The class P rows use the AOT build: it is the configuration with no warm-up
# to confound a thread sweep, which matters more here than JIT parity.
profiles  = ["aot"]
updates  = ["deferred"]
extra_args = ["--deposit-reduce", "binned"]
skip_conformance = true

[[target]]
id       = "csharp-par-private"
lang     = "C#"
backend  = "threads/private"
class    = "P"
dir      = "impl/csharp"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["dotnet"]
profiles  = ["aot"]
updates  = ["deferred"]
extra_args = ["--deposit-reduce", "private"]
skip_conformance = true

# --------------------------------------------------------------------- Fortran
#
# The only statically typed port that needed no argument for exactness: a
# native single-precision real since 1957, and an arithmetic model that says
# what it does. One flag is still required and it is the same one C needs --
# -ffp-contract=off, in build.sh, with the reasoning next to it.

[[target]]
id       = "fortran"
lang     = "Fortran"
backend  = "headless"
class    = "S"
dir      = "impl/fortran"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["gfortran"]
profiles  = ["o2", "o3", "o3-native", "ofast-native"]
# -Ofast implies -ffast-math, which reassociates the nine-term stencil sum.
fastmath_profiles = ["ofast-native"]

# Class P, the way Fortran does it: three directives instead of the C
# reference's five-phase binned decomposition. It gets to skip that machinery
# because SPEC-1's deposit is a constant -- every agent landing in a cell adds
# the same value, so an atomic add is bit-exact whatever the interleaving. The
# other ten class P ports need a counting sort for the same guarantee.
#
# Whether a directive reaches a hand-written decomposition is the question, and
# the answer is in §5.
[[target]]
id       = "fortran-par"
lang     = "Fortran"
backend  = "openmp/atomic"
class    = "P"
dir      = "impl/fortran"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["gfortran"]
profiles  = ["openmp"]
updates  = ["deferred"]
skip_conformance = true

# ----------------------------------------------------------------------- OCaml
#
# The mirror image of the Lean port. OCaml's float array is unboxed, which
# Lean's cannot be; OCaml 4.14 has no float32 type, which Lean does have. So
# tier A costs a rounding call per operation here and nothing there, and the
# data layout costs nothing here and everything there.

[[target]]
id       = "ocaml"
lang     = "OCaml"
backend  = "headless"
class    = "S"
dir      = "impl/ocaml"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["ocamlopt"]
# `unsafe` drops array bounds checks -- OCaml's equivalent of Rust's unchecked
# feature and Go's -gcflags=-B, here to price the checks.
profiles  = ["default", "unsafe"]
updates  = ["serial", "deferred"]

# The same port with the f32 rounding going through a one-instruction C stub
# instead of Int32.float_of_bits (Int32.bits_of_float x). Not a different
# algorithm and not a different tier -- the same numbers, reached with one
# runtime call per rounding instead of two. Separate target rather than a
# profile so conformance verifies it in its own right.
[[target]]
id       = "ocaml-cstub"
lang     = "OCaml"
backend  = "headless/cstub"
class    = "S"
dir      = "impl/ocaml"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["ocamlopt"]
profiles  = ["cstub", "cstub-unsafe"]
updates  = ["serial", "deferred"]

# Tier B: the same binary with the f32 rounding switched off, so every
# intermediate stays f64. Not a fast-math profile -- nothing is reassociated,
# the arithmetic is simply wider -- so it is a separate target with tier = "B"
# rather than a profile of the one above.
[[target]]
id       = "ocaml-f64"
lang     = "OCaml"
backend  = "headless-f64"
class    = "S"
dir      = "impl/ocaml"
build    = "bash build.sh {profile}"
binary   = "build/{profile}/slimebench"
run      = ["{binary}"]
compilers = ["ocamlopt"]
profiles  = ["default"]
tier     = "B"
conformance_set = "micro"
extra_args = ["--f64-intermediates"]


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-label="Class V: what is left for hand-written assembly">

  <style>
    .bg    { fill: none; }
    .lbl   { fill: #24292f; font: 12px ui-monospace, "SF Mono", Menlo, monospace; }

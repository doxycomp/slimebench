<polyline points="62.0,263.5 199.0,225.8 336.0,139.7 473.0,129.7 610.0,174.2" fill="none" stroke="#4c78a8" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="62.0" cy="263.5" r="3.2" fill="#4c78a8"/>

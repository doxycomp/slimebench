<circle cx="610.0" cy="324.4" r="3.2" fill="#e45756"/>
<text x="618.0" y="328.4" class="lbl-s" fill="#e45756">3.12 threads</text>
<polyline points="62.0,263.5 199.0,227.0 336.0,120.7 473.0,107.7 610.0,165.6" fill="none" stroke="#f58518" stroke-width="2.2" stroke-linejoin="round"/>

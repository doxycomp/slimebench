<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="What the GIL costs, with everything else held fixed">

  <style>
    .bg    { fill: none; }
    .lbl   { fill: #24292f; font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
    .lbl-s { fill: #57606a; font: 10px ui-monospace, "SF Mono", Menlo, monospace; }
    .ttl   { fill: #24292f; font: 600 14px -apple-system, "Segoe UI", sans-serif; }
    .sub   { fill: #57606a; font: 11px -apple-system, "Segoe UI", sans-serif; }
    .axis  { stroke: #d0d7de; stroke-width: 1; }
    .grid  { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
    @media (prefers-color-scheme: dark) {
      .lbl   { fill: #e6edf3; }
      .lbl-s { fill: #9198a1; }
      .ttl   { fill: #e6edf3; }
      .sub   { fill: #9198a1; }
      .axis  { stroke: #3d444d; }
      .grid  { stroke: #3d444d; }
    }
  </style>

<text x="16" y="22" class="ttl">What the GIL costs, with everything else held fixed</text>
<text x="16" y="39" class="sub">Same Worker, same phase order, binned reduction, small 1024^2, 100 ticks. Above the dashed line the extra workers are paying for themselves.</text>
<line x1="62" y1="334.0" x2="610" y2="334.0" class="grid"/>
<text x="54" y="338.0" class="lbl-s" text-anchor="end">0</text>
<line x1="62" y1="193.0" x2="610" y2="193.0" class="grid"/>
<text x="54" y="197.0" class="lbl-s" text-anchor="end">2</text>

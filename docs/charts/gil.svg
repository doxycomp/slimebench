<text x="616" y="267.5" class="lbl-s">1 thread</text>
<polyline points="62.0,263.5 199.0,242.0 336.0,289.2 473.0,314.2 610.0,324.4" fill="none" stroke="#e45756" stroke-width="2.2" stroke-linejoin="round"/>

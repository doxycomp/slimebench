<text x="54" y="56.0" class="lbl-s" text-anchor="end">4</text>
<text x="62.0" y="352" class="lbl-s" text-anchor="middle">1</text>
<text x="199.0" y="352" class="lbl-s" text-anchor="middle">2</text>
<text x="336.0" y="352" class="lbl-s" text-anchor="middle">4</text>
<text x="473.0" y="352" class="lbl-s" text-anchor="middle">8</text>
<text x="610.0" y="352" class="lbl-s" text-anchor="middle">16</text>

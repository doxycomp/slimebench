<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Class P: how the two deposit reductions scale">

  <style>
    .bg    { fill: none; }
    .lbl   { fill: #24292f; font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
    .lbl-s { fill: #57606a; font: 10px ui-monospace, "SF Mono", Menlo, monospace; }
    .ttl   { fill: #24292f; font: 600 14px -apple-system, "Segoe UI", sans-serif; }
    .sub   { fill: #57606a; font: 11px -apple-system, "Segoe UI", sans-serif; }
    .axis  { stroke: #d0d7de; stroke-width: 1; }
    .grid  { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
    @media (prefers-color-scheme: dark) {
      .lbl   { fill: #e6edf3; }
      .lbl-s { fill: #9198a1; }
      .ttl   { fill: #e6edf3; }
      .sub   { fill: #9198a1; }
      .axis  { stroke: #3d444d; }
      .grid  { stroke: #3d444d; }
    }
  </style>

<text x="16" y="22" class="ttl">Class P: how the two deposit reductions scale</text>
<text x="16" y="39" class="sub">2048x2048, 1 048 576 agents, deferred. 16 physical cores, 32 logical.</text>
